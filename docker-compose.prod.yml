services:
  zapagenda-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - zapagenda_postgres_data:/var/lib/postgresql/data

  zapagenda-rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    volumes:
      - zapagenda_rabbitmq_data:/var/lib/rabbitmq

  zapagenda-nlp:
    image: gustavodamassa/zapagenda-nlp:latest
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - zapagenda-postgres

  zapagenda-api:
    image: gustavodamassa/zapagenda-api:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - zapagenda_baileys_auth:/app/baileys-auth
    depends_on:
      - zapagenda-postgres
      - zapagenda-rabbitmq
      - zapagenda-nlp

  zapagenda-nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - zapagenda-api

volumes:
  zapagenda_postgres_data:
  zapagenda_rabbitmq_data:
  zapagenda_baileys_auth:
