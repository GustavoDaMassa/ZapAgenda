name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-api:
    name: Build & push API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push zapagenda-api
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: gustavodamassa/zapagenda-api:latest

  build-nlp:
    name: Build & push NLP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push zapagenda-nlp
        uses: docker/build-push-action@v5
        with:
          context: ./nlp
          push: true
          tags: gustavodamassa/zapagenda-nlp:latest
