name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Run unit tests
        run: npm test -- --passWithNoTests
        working-directory: api

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push zapagenda-api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: gustavodamassa/zapagenda-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build e push zapagenda-nlp
        uses: docker/build-push-action@v6
        with:
          context: ./nlp
          push: true
          tags: gustavodamassa/zapagenda-nlp:latest
          cache-from: type=gha,scope=nlp
          cache-to: type=gha,mode=max,scope=nlp
