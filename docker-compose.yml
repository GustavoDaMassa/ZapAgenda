services:
  postgres:
    image: postgres:15-alpine
    container_name: zapzap-postgres
    environment:
      POSTGRES_USER: zapzap
      POSTGRES_PASSWORD: zapzap
      POSTGRES_DB: zapzap
    ports:
      - "5432:5432"
    volumes:
      - zapzap_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zapzap-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - zapzap_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  zapzap_postgres_data:
  zapzap_rabbitmq_data:
