services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  nlp:
    build: ./nlp
    env_file: ./nlp/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  api:
    build: ./api
    env_file: ./api/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - rabbitmq
      - nlp

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
